# ===========================
# Server
# ===========================
server.port=8080

# ===========================
# Database - H2 (temporary, no installation needed)
# ===========================
spring.datasource.url=jdbc:h2:file:./pos_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ===========================
# MySQL (uncomment when MySQL is installed, comment out H2 above)
# ===========================
# spring.datasource.url=jdbc:mysql://localhost:3306/pos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# Logging
# ===========================
logging.level.com.pos.system=INFO
logging.level.org.springframework.security=WARN
